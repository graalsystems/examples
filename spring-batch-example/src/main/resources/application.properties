spring.main.banner-mode=off
# In-memory H2: the job repository and the `sale` table live for the duration of the run.
spring.datasource.url=jdbc:h2:mem:sales;DB_CLOSE_DELAY=-1
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
logging.level.root=WARN
logging.level.graal.systems.examples=INFO
logging.level.org.springframework.batch.core.launch=INFO
# Fail the run when more input rows than this are rejected.
sales.max-rejected=5
