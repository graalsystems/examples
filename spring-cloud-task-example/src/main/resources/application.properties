spring.main.banner-mode=off
# In-memory H2 for the task repository (TASK_EXECUTION, ...): it lives for the duration of the run.
spring.datasource.url=jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1
logging.level.root=WARN
logging.level.graal.systems.examples=INFO
# Used when the job sets no task_name (graal passes it as -Dspring.cloud.task.name).
spring.cloud.task.name=reconcile-payments
# Amount, in cents, below which a difference between an invoice and its payment is accepted.
reconcile.tolerance-cents=50
